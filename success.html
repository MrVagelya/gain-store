<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment complete — Gain</title>
    <link rel="stylesheet" href="styles.css?v=11" />
  </head>
  <body class="success-page">
    <div class="fx-grid" aria-hidden="true"></div>
    <main class="success-wrap">
      <h1>Payment received</h1>
      <p id="status" class="success-status">Preparing your license key…</p>
      <p id="email-notice" class="success-email" hidden></p>
      <div class="success-key" id="key-box" hidden>
        <p class="kicker">Your license key</p>
        <code id="license-key"></code>
        <button type="button" id="copy-key">Copy key</button>
        <p class="hint">Your key and loader script are also emailed to you. Save a copy here — one device per key.</p>
        <div class="code">
          <button type="button" id="copy-snippet">Copy loader</button>
          <pre><code id="loader-snippet"></code></pre>
        </div>
      </div>
      <p class="success-help">
        Having trouble?
        <a id="discord-link" href="https://discord.gg/PBMHrgJ4Kd">Open Discord support</a>
      </p>
      <a class="cta cta-secondary" href="index.html">Back to store</a>
    </main>
    <script src="site-config.js?v=11"></script>
    <script src="success.js?v=11"></script>
  </body>
</html>
